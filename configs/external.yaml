# environment
visible_gpus: '1'
seed: 42

# dataset
dataset: 'external'
task: 'survival'
checkpoints: './checkpoints'
results: './results'

kfold: -1 # use the external validation set
stratify: True
step: 1. # step for time bin discretization in days
normalize: False
pad_left: 1 # number of left padding intervals
pad_right: 1 # number of right padding intervals

# model
method: 'ordsurv' # 'ordsurv', 'deephit', 'deepsurv', 'nll'
backbone: 'MLP'
n_layers: 2
d_hid: 2048
dropout: 0.
activation: 'leaky_relu'


# training
workers: 0
optimizer: 'Adam'
epochs: 100
batch_size: 256
lr: 2.0e-4
lr_policy: 'cosine'
weight_decay: 0.01
verbose: True
