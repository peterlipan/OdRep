# environment
visible_gpus: '1'
seed: 42

# dataset
dataset: 'external'
task: 'survival'
checkpoints: './checkpoints'
results: './results'

kfold: -1 # use the external validation set
stratify: True
step: 30. # step for time bin discretization in days
normalize: False

# model
method: 'decouple' # 'ordsurv', 'deephit', 'deepsurv', 'nll'
backbone: 'MLP'
n_layers: 4
d_hid: 1024
dropout: 0.
activation: 'tanh'


# training
workers: 0
optimizer: 'Adam'
epochs: 100
batch_size: 256
lr: 2.0e-4
lr_policy: 'cosine'
weight_decay: 0.01
verbose: True
